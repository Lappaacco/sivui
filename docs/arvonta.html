<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilojaloin Arvonta</title>
    <link rel="icon" type="image/svg+xml" href="/ilojaloin.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #ECEFF4 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(42, 111, 211, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2A6FD3 0%, #1e5bb8 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .header a {
            color: white;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .header a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .content {
            padding: 40px 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2A6FD3;
            box-shadow: 0 0 0 3px rgba(42, 111, 211, 0.1);
        }

        .bulk-section {
            margin-top: 20px;
        }

        .btn-toggle {
            width: 100%;
            padding: 12px;
            background: #F5F7FA;
            border: 2px dashed #2A6FD3;
            border-radius: 10px;
            color: #2A6FD3;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-toggle:hover {
            background: #ECEFF4;
            border-color: #1e5bb8;
        }

        .bulk-input-area {
            margin-top: 15px;
            padding: 20px;
            background: #F5F7FA;
            border-radius: 10px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 500px;
            }
        }

        .bulk-help {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95em;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #2A6FD3;
            box-shadow: 0 0 0 3px rgba(42, 111, 211, 0.1);
        }

        .bulk-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-cancel {
            background: #ECEFF4;
            color: #333;
            flex: 1;
        }

        .btn-cancel:hover {
            background: #dde1e6;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-add {
            background: #2A6FD3;
            color: white;
        }

        .btn-add:hover {
            background: #1e5bb8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 111, 211, 0.3);
        }

        .btn-draw {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            width: 100%;
            padding: 20px;
            font-size: 1.3em;
            margin-top: 20px;
        }

        .btn-draw:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-draw:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .multi-winner-section {
            margin-top: 15px;
            padding: 15px;
            background: #F5F7FA;
            border-radius: 10px;
        }

        .multi-winner-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .multi-winner-controls label {
            font-weight: 600;
            color: #2A6FD3;
        }

        .multi-winner-controls input[type="number"] {
            width: 80px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            text-align: center;
        }

        .multi-winner-controls input[type="number"]:focus {
            outline: none;
            border-color: #2A6FD3;
        }

        .btn-draw-multi {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            color: white;
            width: 100%;
            padding: 18px;
            font-size: 1.2em;
        }

        .btn-draw-multi:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(156, 39, 176, 0.4);
        }

        .btn-draw-multi:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f44336;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .participants-list {
            background: #F5F7FA;
            border-radius: 15px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            padding-bottom: 24px;
        }

        .participants-list h3 {
            color: #2A6FD3;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .participant-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(42, 111, 211, 0.08);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .participant-name {
            font-weight: 600;
            color: #333;
        }

        .participant-number {
            background: #2A6FD3;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .btn-remove {
            background: #FFD4C2;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn-remove:hover {
            background: #ffb8a0;
        }

        .winner-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Blocking overlay shown while draw is running to prevent interactions */
        .blocking-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 900;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            color: white;
            font-weight: 700;
        }

        .blocking-overlay.active {
            display: flex;
        }

        .blocking-box {
            background: rgba(255,255,255,0.06);
            padding: 24px 36px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 1.3em;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .winner-overlay.active {
            display: flex;
        }

        .winner-content {
            text-align: center;
            color: white;
            animation: winnerAppear 1s ease;
            position: relative;
            z-index: 1002;
            max-height: 90vh;
            max-width: 90vw;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 20px;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        @keyframes winnerAppear {
            from {
                opacity: 0;
                transform: scale(0.5) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .winner-content h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #FFFAC2;
            text-shadow: 0 0 20px rgba(255, 250, 194, 0.6);
        }

        .winner-name {
            font-size: 4em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 30px rgba(74, 151, 233, 0.8);
            margin: 30px 0;
            animation: pulse 2s infinite;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
            line-height: 1.3;
        }

        .winner-name.multi-winners {
            font-size: 2em;
            animation: none;
            text-align: center;
            white-space: pre-line;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .winner-subtitle {
            font-size: 1.5em;
            margin-top: 20px;
            color: #4A97E9;
        }

        .close-winner {
            margin-top: 40px;
            padding: 15px 40px;
            background: #2A6FD3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            flex-shrink: 0;
        }

        .close-winner:hover {
            background: #1e5bb8;
            transform: scale(1.05);
        }

        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .drumroll {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .winner-name {
                font-size: 2.5em;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .blocking-box {
                padding: 18px 26px;
                gap: 12px;
                font-size: 1em;
            }
            
            .spinner {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎁 Ilojaloin Arvonta</h1>
            <p><a href="https://ilojaloin.fi/" target="_blank">Ilojaloin Jalkaterapiapalvelut</a></p>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="nameInput" 
                        placeholder="Lisää osallistujan nimi..." 
                        autocomplete="off"
                    >
                    <button class="btn btn-add" onclick="addParticipant()">Lisää</button>
                </div>
                
                <div class="bulk-section">
                    <button class="btn-toggle" onclick="toggleBulkInput()">
                        📋 Lisää useita nimiä kerralla
                    </button>
                    <div id="bulkInputArea" class="bulk-input-area" style="display: none;">
                        <p class="bulk-help">Liitä nimet tähän (yksi per rivi tai pilkuilla erotettuina):</p>
                        <textarea 
                            id="bulkInput" 
                            placeholder="Esim:&#10;Matti Meikäläinen&#10;Teijo Teikäläinen&#10;Erkki Esimerkki&#10;&#10;tai pilkuilla: Matti Meikäläinen, Teijo Teikäläinen, Erkki Esimerkki"
                            rows="8"
                        ></textarea>
                        <div class="bulk-buttons">
                            <button class="btn btn-add" onclick="addBulkParticipants()">Lisää kaikki</button>
                            <button class="btn btn-cancel" onclick="clearBulkInput()">Tyhjennä</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="participants-list">
                <h3>Osallistujat (<span id="count">0</span>)</h3>
                <div id="participantsList"></div>
            </div>

            <button class="btn btn-draw" id="drawBtn" onclick="startDraw()" disabled>
                Arvo Voittaja
            </button>
            
            <div class="multi-winner-section">
                <div class="multi-winner-controls">
                    <label for="winnerCount">Voittajien määrä:</label>
                    <input type="number" id="winnerCount" min="2" max="20" value="3">
                </div>
                <button class="btn btn-draw-multi" id="drawMultiBtn" onclick="startMultiDraw()" disabled>
                    Arvo Useita Voittajia
                </button>
            </div>
            
            <button class="btn btn-reset" onclick="resetAll()">
                Tyhjennä Lista
            </button>
        </div>
    </div>

    <div class="winner-overlay" id="winnerOverlay">
        <canvas id="fireworks-canvas"></canvas>
        <div class="winner-content">
            <h2>🎉 ONNEA! 🎉</h2>
            <div class="winner-name" id="winnerName"></div>
            <div class="winner-subtitle">Voitit Ilojaloin arvonnassa!</div>
            <button class="close-winner" onclick="closeWinner()">Sulje</button>
        </div>
    </div>

    <!-- Blocking overlay shown while draw is running -->
    <div class="blocking-overlay" id="blockingOverlay" aria-hidden="true">
        <div class="blocking-box">
            <div class="spinner" aria-hidden="true"></div>
            <div>Arvonta käynnissä — odota hetki...</div>
        </div>
    </div>

    <script>
        let participants = [];
        let isDrawing = false;
        const STORAGE_KEY = 'ilojaloin_arvonta_participants';

        // Tallenna lista localStorageen
        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(participants));
            } catch (e) {
                console.error('Virhe tallennuksessa:', e);
            }
        }

        // Lataa lista localStoragesta
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    participants = JSON.parse(saved);
                }
            } catch (e) {
                console.error('Virhe latauksessa:', e);
                participants = [];
            }
        }

        function setDrawingState(state) {
            isDrawing = state;
            const drawBtn = document.getElementById('drawBtn');
            const drawMultiBtn = document.getElementById('drawMultiBtn');
            const nameInput = document.getElementById('nameInput');
            const winnerCountInput = document.getElementById('winnerCount');

            if (drawBtn) drawBtn.disabled = state;
            if (drawMultiBtn) drawMultiBtn.disabled = state;
            if (nameInput) nameInput.disabled = state;
            if (winnerCountInput) winnerCountInput.disabled = state;

            // Toggle blocking overlay to prevent interactions during draw
            const blocking = document.getElementById('blockingOverlay');
            if (blocking) {
                if (state) blocking.classList.add('active');
                else blocking.classList.remove('active');
            }

            updateList();
        }

        // Lisää osallistuja
        function addParticipant() {
            if (isDrawing) {
                alert('Arvonta on käynnissä — et voi lisätä nimiä.');
                return;
            }
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            
            if (name === '') {
                alert('Syötä osallistujan nimi!');
                return;
            }
            
            if (participants.includes(name)) {
                alert('Tämä nimi on jo listalla!');
                return;
            }
            
            participants.push(name);
            input.value = '';
            input.focus();
            updateList();
        }

        // Poista osallistuja
        function removeParticipant(index) {
            if (isDrawing) {
                alert('Arvonta on käynnissä — et voi poistaa nimiä.');
                return;
            }
            participants.splice(index, 1);
            updateList();
        }

        // Päivitä lista
        function updateList() {
            const list = document.getElementById('participantsList');
            const count = document.getElementById('count');
            const drawBtn = document.getElementById('drawBtn');
            const drawMultiBtn = document.getElementById('drawMultiBtn');
            
            count.textContent = participants.length;
            if (!isDrawing) {
                drawBtn.disabled = participants.length < 2;
                drawMultiBtn.disabled = participants.length < 2;
            }
            
            if (participants.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
                        </svg>
                        <p>Ei vielä osallistujia.<br>Lisää nimiä aloittaaksesi!</p>
                    </div>
                `;
            } else {
                list.innerHTML = participants.map((name, index) => {
                    const removeBtn = isDrawing ? '<button class="btn-remove" disabled>Poista</button>' : `<button class="btn-remove" onclick="removeParticipant(${index})">Poista</button>`;
                    return `
                    <div class="participant-item">
                        <span class="participant-name">${name}</span>
                        <div>
                            <span class="participant-number">#${index + 1}</span>
                            ${removeBtn}
                        </div>
                    </div>
                `;
                }).join('');
            }
            
            // Tallenna lista aina kun se päivittyy
            saveToLocalStorage();
        }

        // Aloita arvonta
        function startDraw() {
            const drawBtn = document.getElementById('drawBtn');
            setDrawingState(true);
            if (drawBtn) {
                drawBtn.classList.add('drumroll');
                drawBtn.textContent = 'Arvotaan...';
            }
            
            // Animoitu arvonta
            let counter = 0;
            const maxCount = 20;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * participants.length);
                if (drawBtn) drawBtn.textContent = participants[randomIndex];
                counter++;
                
                if (counter >= maxCount) {
                    clearInterval(interval);
                    const winnerIndex = Math.floor(Math.random() * participants.length);
                    const winner = participants[winnerIndex];
                    setDrawingState(false);
                    showWinner(winner);
                    if (drawBtn) {
                        drawBtn.classList.remove('drumroll');
                        drawBtn.textContent = 'Arvo Voittaja';
                        drawBtn.disabled = false;
                    }
                }
            }, 100);
        }

        // Aloita usean voittajan arvonta
        function startMultiDraw() {
            const winnerCountInput = document.getElementById('winnerCount');
            const requestedCount = parseInt(winnerCountInput.value);
            
            if (requestedCount < 2 || requestedCount > 20) {
                alert('Voittajien määrän täytyy olla 2-20 välillä!');
                return;
            }
            
            if (requestedCount > participants.length) {
                alert(`Osallistujia on vain ${participants.length}. Valitse pienempi määrä!`);
                return;
            }
            
            const drawMultiBtn = document.getElementById('drawMultiBtn');
            setDrawingState(true);
            if (drawMultiBtn) {
                drawMultiBtn.classList.add('drumroll');
                drawMultiBtn.textContent = 'Arvotaan...';
            }
            
            // Animoitu arvonta
            let counter = 0;
            const maxCount = 30;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * participants.length);
                drawMultiBtn.textContent = participants[randomIndex];
                counter++;
                
                if (counter >= maxCount) {
                    clearInterval(interval);
                    
                    // Arvo useita voittajia
                    const winners = [];
                    const availableParticipants = [...participants];
                    
                    for (let i = 0; i < requestedCount; i++) {
                        const randomIndex = Math.floor(Math.random() * availableParticipants.length);
                        winners.push(availableParticipants[randomIndex]);
                        availableParticipants.splice(randomIndex, 1);
                    }
                    
                    setDrawingState(false);
                    showMultipleWinners(winners);
                    if (drawMultiBtn) {
                        drawMultiBtn.classList.remove('drumroll');
                        drawMultiBtn.textContent = 'Arvo Useita Voittajia';
                        drawMultiBtn.disabled = false;
                    }
                }
            }, 100);
        }

        // Näytä voittaja
        function showWinner(winner) {
            const winnerNameEl = document.getElementById('winnerName');
            winnerNameEl.textContent = winner;
            winnerNameEl.classList.remove('multi-winners');
            document.getElementById('winnerOverlay').classList.add('active');
            startFireworks();
        }

        // Näytä useita voittajia
        function showMultipleWinners(winners) {
            const winnerText = winners.map((name, i) => `${i + 1}. ${name}`).join('\n');
            const winnerNameEl = document.getElementById('winnerName');
            winnerNameEl.innerHTML = winnerText.replace(/\n/g, '<br>');
            winnerNameEl.classList.add('multi-winners');
            document.getElementById('winnerOverlay').classList.add('active');
            startFireworks();
        }

        // Sulje voittaja-overlay
        function closeWinner() {
            document.getElementById('winnerOverlay').classList.remove('active');
            document.getElementById('winnerName').classList.remove('multi-winners');
            stopFireworks();
        }

        let fireworksAnimationId = null;

        function stopFireworks() {
            if (fireworksAnimationId) {
                cancelAnimationFrame(fireworksAnimationId);
                fireworksAnimationId = null;
            }
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Tyhjennä kaikki
        function resetAll() {
            if (isDrawing) {
                alert('Arvonta on käynnissä — et voi tyhjentää listaa.');
                return;
            }
            if (participants.length === 0) return;
            
            if (confirm('Haluatko varmasti tyhjentää koko listan?')) {
                participants = [];
                localStorage.removeItem(STORAGE_KEY);
                updateList();
            }
        }

        // Bulk-syötön näyttö/piilotus
        function toggleBulkInput() {
            const bulkArea = document.getElementById('bulkInputArea');
            if (bulkArea.style.display === 'none') {
                bulkArea.style.display = 'block';
            } else {
                bulkArea.style.display = 'none';
            }
        }

        // Tyhjennä bulk-syöttö
        function clearBulkInput() {
            document.getElementById('bulkInput').value = '';
        }

        // Lisää useita osallistujia kerralla
        function addBulkParticipants() {
            if (isDrawing) {
                alert('Arvonta on käynnissä — et voi lisätä nimiä.');
                return;
            }
            const bulkInput = document.getElementById('bulkInput');
            const text = bulkInput.value.trim();
            
            if (text === '') {
                alert('Liitä nimet tekstikenttään!');
                return;
            }
            
            // Jaa ensin riveittäin, sitten pilkuilla
            let names = [];
            const lines = text.split('\n');
            
            lines.forEach(line => {
                const lineNames = line.split(',').map(name => name.trim()).filter(name => name !== '');
                names = names.concat(lineNames);
            });
            
            if (names.length === 0) {
                alert('Ei löytynyt yhtään nimeä!');
                return;
            }
            
            let added = 0;
            let skipped = 0;
            let duplicates = [];
            
            names.forEach(name => {
                if (name && !participants.includes(name)) {
                    participants.push(name);
                    added++;
                } else if (participants.includes(name)) {
                    duplicates.push(name);
                    skipped++;
                }
            });
            
            updateList();
            bulkInput.value = '';
            toggleBulkInput();
            
            let message = `Lisätty ${added} osallistujaa!`;
            if (skipped > 0) {
                message += `\n${skipped} nimeä ohitettiin (duplikaatit).`;
            }
            alert(message);
        }

        // Enter-näppäin lisää osallistujan
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addParticipant();
            }
        });

        // Ilotulitus-animaatio
        function startFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            
            // Varmista että canvas on oikean kokoinen
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Lisää resize listener
            const resizeHandler = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resizeHandler);
            
            const fireworks = [];
            const particles = [];
            
            class Firework {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.targetY = Math.random() * canvas.height / 2;
                    this.speed = 5;
                    this.angle = Math.PI / 2;
                    this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                }
                
                update() {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.explode();
                        return false;
                    }
                    return true;
                }
                
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                
                explode() {
                    const isMobile = window.innerWidth < 768;
                    const particleCount = isMobile ? 25 : 50;
                    for (let i = 0; i < particleCount; i++) {
                        particles.push(new Particle(this.x, this.y, this.color));
                    }
                }
            }
            
            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.velocity = {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    };
                    this.alpha = 1;
                    this.decay = 0.015;
                }
                
                update() {
                    this.velocity.y += 0.1;
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    this.alpha -= this.decay;
                    return this.alpha > 0;
                }
                
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
            
            let frameCount = 0;
            
            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Lisää uusia ilotulituksia jatkuvasti (harvemmin mobiilissa)
                const isMobile = window.innerWidth < 768;
                const interval = isMobile ? 30 : 20;
                
                if (frameCount % interval === 0) {
                    fireworks.push(new Firework());
                }
                
                // Päivitä ja piirrä ilotulitukset
                for (let i = fireworks.length - 1; i >= 0; i--) {
                    if (!fireworks[i].update()) {
                        fireworks.splice(i, 1);
                    } else {
                        fireworks[i].draw();
                    }
                }
                
                // Päivitä ja piirrä partikkelit
                for (let i = particles.length - 1; i >= 0; i--) {
                    if (!particles[i].update()) {
                        particles.splice(i, 1);
                    } else {
                        particles[i].draw();
                    }
                }
                
                frameCount++;
                
                // Jatka loputtomasti kunnes pysäytetään
                fireworksAnimationId = requestAnimationFrame(animate);
            }
            
            animate();
        }

        // Lataa tallennettu lista ja alusta näkymä
        loadFromLocalStorage();
        updateList();
    </script>
</body>
